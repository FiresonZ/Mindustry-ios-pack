name: Mindustry iOS IPA Auto Build (Unsigned / TrollStore)

# =============================================================
# 自动检测 + 打包 Mindustry iOS IPA（未签名版，TrollStore 安装）
# =============================================================
# 触发方式：
#   1. schedule: 每 6 小时检测 Anuken/Mindustry 最新 release
#   2. workflow_dispatch: 手动运行（可指定 BUILD_VERSION，如 146）
#
# 版本号严格规则（与 App Store 保持一致）：
#   CFBundleShortVersionString = 8.<BUILD_VERSION>.0
#   CFBundleVersion            = <BUILD_VERSION>
#   源码 tag                   = v<BUILD_VERSION>
#
# Repository Secrets（可选）：
#   PAT_GITHUB  Personal Access Token，用于 schedule 成功后自动回写 LAST_VERSION
#
# 说明：本工作流默认生成 **未签名 IPA**，无需 Apple 开发者账号 / 证书 / 描述文件。
#       使用 TrollStore（或 AltStore / Sideloadly 等）对 IPA 进行自签安装即可运行。
# =============================================================

on:
  schedule:
    # 每 6 小时：UTC 0/6/12/18 点 17 分
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Mindustry 构建号（对应 tag v<BUILD_VERSION>，如 146）。留空则自动检测最新版。'
        required: false
        default: ''
      force_build:
        description: '强制构建（即使版本号未变化）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ios-ipa-build-${{ github.ref }}
  cancel-in-progress: false

env:
  STATE_FILE: ${{ github.workspace }}/LAST_VERSION
  # GitHub Actions runners 已弃用 Node 20，强制所有 Node-based actions 运行于 Node 24，消除告警
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # =========================================================
  #  Job 1: 检查版本（Ubuntu，低成本）
  # =========================================================
  check-version:
    name: Check Mindustry Release Version
    runs-on: ubuntu-22.04
    outputs:
      needs_build:   ${{ steps.decide.outputs.needs_build }}
      release_tag:   ${{ steps.decide.outputs.release_tag }}
      build_version: ${{ steps.decide.outputs.build_version }}
      display_ver:   ${{ steps.decide.outputs.display_ver }}
      reason:        ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        name: Checkout packager repo
        with:
          # 本仓库不使用 Git Submodule，显式关闭可避免 post-job cleanup 因 runner 残留或嵌套
          # git 目录（如 build-root/Mindustry）误报 "No url found for submodule path 'Mindustry'"
          submodules: false

      - name: Restore LAST_VERSION cache (跨 run 状态)
        uses: actions/cache/restore@v6
        with:
          path: LAST_VERSION
          key: mindustry-ios-last-version
          restore-keys: |
            mindustry-ios-last-version

      - name: Run check-version.sh
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/check-version.sh
          set +e
          OUT=$(STATE_FILE="${{ env.STATE_FILE }}" ./scripts/check-version.sh)
          RC=$?
          echo "$OUT"
          set -e
          if [ $RC -ne 0 ]; then
            echo "check-version.sh failed with exit=$RC"
            exit $RC
          fi
          # 写入 step outputs
          echo "$OUT" >> "$GITHUB_OUTPUT"
          # 同时作为 env 供后续使用
          echo "$OUT" >> "$GITHUB_ENV"

      - name: Decide whether to build
        id: decide
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}
        run: |
          # 手动指定 build_version
          MANUAL="${{ github.event.inputs.build_version }}"
          FORCE="${{ github.event.inputs.force_build }}"
          AUTO_NEEDS="${{ env.NEEDS_BUILD }}"
          AUTO_DISPLAY="${{ env.DISPLAY_VERSION }}"
          TAG=""
          BUILD=""
          DISPLAY=""
          REASON=""
          NEEDS="false"

          AUTH=()
          if [ -n "$GITHUB_TOKEN" ]; then
            AUTH=(-H "Authorization: Bearer $GITHUB_TOKEN")
          fi

          if [ -n "$MANUAL" ]; then
            BUILD="$MANUAL"
            TAG="v${MANUAL}"
            NEEDS="true"
            REASON="manual dispatch, build_version=$MANUAL"
            # 验证 tag 是否真实存在
            echo "验证 Anuken/Mindustry 是否存在 tag ${TAG} ..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${AUTH[@]}" \
              "https://api.github.com/repos/Anuken/Mindustry/git/ref/tags/${TAG}")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error:: 未找到 Anuken/Mindustry tag=${TAG} (HTTP $HTTP_CODE)，严格遵循版本号打包失败。"
              exit 1
            fi
            echo "    确认 tag=${TAG} 存在 ✓"
          else
            TAG="${{ env.RELEASE_TAG }}"
            BUILD="${{ env.BUILD_VERSION }}"
            if [ "$FORCE" = "true" ]; then
              NEEDS="true"
              REASON="manual force build"
            elif [ "$AUTO_NEEDS" = "true" ]; then
              NEEDS="true"
              REASON="new release detected (${TAG})"
            else
              NEEDS="false"
              REASON="already at latest (${TAG})"
            fi
          fi

          # ========== 计算显示版本（兼容整数 v146 & 小数 v159.7） ==========
          # 自动检测路径：优先使用 check-version.sh 输出的 DISPLAY_VERSION
          # 手动指定或兜底：按规则自行推导 3 段式 CFBundleShortVersionString
          if [ -n "$AUTO_DISPLAY" ] && [ -z "$MANUAL" ]; then
            DISPLAY="$AUTO_DISPLAY"
          else
            if [[ "$BUILD" == *.* ]]; then
              DISPLAY="8.${BUILD}"        # 如 159.7 -> 8.159.7
            else
              DISPLAY="8.${BUILD}.0"      # 如 146  -> 8.146.0
            fi
          fi

          echo "needs_build=$NEEDS"    >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG"      >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD"  >> "$GITHUB_OUTPUT"
          echo "display_ver=$DISPLAY"  >> "$GITHUB_OUTPUT"
          echo "reason=$REASON"        >> "$GITHUB_OUTPUT"

          echo "==============================================="
          echo " Decision Summary"
          echo "   Release Tag : $TAG"
          echo "   Build #     : $BUILD"
          echo "   Display Ver : $DISPLAY"
          echo "   Build Now?  : $NEEDS"
          echo "   Reason      : $REASON"
          echo "==============================================="

  # =========================================================
  #  Job 2: 构建 IPA（macOS，必须在 Apple 机器上）
  # =========================================================
  build-ipa:
    name: Build iOS IPA (${{ needs.check-version.outputs.release_tag }})
    needs: check-version
    if: needs.check-version.outputs.needs_build == 'true'
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        name: Checkout packager repo
        with:
          # 本仓库不使用 Git Submodule；build-ipa.sh 会在 build-root 下通过 git clone 拉取
          # Mindustry/Arc（嵌套 git 目录），关闭 submodules 避免 post-job 清理误判为子模块报错
          submodules: false

      - name: Echo build parameters
        shell: bash
        run: |
          echo "Release Tag      : ${{ needs.check-version.outputs.release_tag }}"
          echo "Build Version    : ${{ needs.check-version.outputs.build_version }}"
          echo "Display Version  : ${{ needs.check-version.outputs.display_ver }}"
          echo "Reason           : ${{ needs.check-version.outputs.reason }}"
          echo "macOS Version    : $(sw_vers -productVersion)"
          echo "Xcode Version    : $(xcodebuild -version | head -1)"
          echo "Signing Mode     : UNSIGNED (TrollStore / AltStore / Sideloadly 安装)"

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Java
        shell: bash
        run: java -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Run build-ipa.sh (unsigned)
        id: build
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.check-version.outputs.build_version }}
          # 固定未签名：无需 Apple 开发者证书 / 描述文件，产物通过 TrollStore 等工具安装
          SKIP_SIGNING:  'true'
        run: |
          chmod +x ./scripts/build-ipa.sh
          set -o pipefail
          ./scripts/build-ipa.sh 2>&1 | tee build-ipa.log | tail -150
          # 从脚本最后输出中解析
          LAST=$(tail -5 build-ipa.log | grep -E '^(IPA_OUTPUT|IPA_META|RELEASE_TAG|BUILD_VERSION|DISPLAY_VERSION)=' || true)
          echo "$LAST"
          echo "$LAST" >> "$GITHUB_OUTPUT"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ needs.check-version.outputs.release_tag }}
          path: build-ipa.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload IPA as Artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Mindustry-iOS-${{ needs.check-version.outputs.release_tag }}
          path: |
            dist/*.ipa
            dist/*.meta.txt
          retention-days: 90
          compression-level: 6
          if-no-files-found: error

      # =========================================================
      #  创建 GitHub Release（仅当非手动 / 非 force）
      # =========================================================
      - name: Create GitHub Release
        if: success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_build != 'true'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ needs.check-version.outputs.release_tag }}
          name: Mindustry iOS IPA ${{ needs.check-version.outputs.display_ver }} (${{ needs.check-version.outputs.release_tag }})
          body: |
            # Mindustry iOS IPA

            | 项目 | 值 |
            | --- | --- |
            | Mindustry Release | [${{ needs.check-version.outputs.release_tag }}](https://github.com/Anuken/Mindustry/releases/tag/${{ needs.check-version.outputs.release_tag }}) |
            | Build Version | `${{ needs.check-version.outputs.build_version }}` |
            | CFBundleShortVersionString | `${{ needs.check-version.outputs.display_ver }}` |
            | CFBundleVersion | `${{ needs.check-version.outputs.build_version }}` |
            | Upstream Commit URL | https://github.com/Anuken/Mindustry/tree/${{ needs.check-version.outputs.release_tag }} |

            > **安装方式**：本 IPA 为**未签名**版本，需通过以下方式之一安装到真机：
            > - **TrollStore（推荐）**：直接在 TrollStore 中打开 IPA 安装即可，无需再签名
            > - **AltStore / Sideloadly**：侧载自签安装（7 天证书限制，付费开发者可一年）
          files: |
            dist/*.ipa
            dist/*.meta.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}

      # =========================================================
      #  更新 LAST_VERSION（写入缓存 + 回写仓库）
      # =========================================================
      - name: Update LAST_VERSION state (cache)
        if: success()
        shell: bash
        run: |
          chmod +x ./scripts/bump-last-version.sh
          ./scripts/bump-last-version.sh "${{ needs.check-version.outputs.release_tag }}"

      - name: Save LAST_VERSION cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: LAST_VERSION
          key: mindustry-ios-last-version-${{ github.run_id }}

      - name: Commit & Push LAST_VERSION back to repo
        if: success()
        shell: bash
        env:
          # 优先使用 PAT（可跨 repo 推），兜底 GITHUB_TOKEN（本仓库即可）
          PUSH_TOKEN: ${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "WARN: 无可用 push token，跳过 repo 回写（LAST_VERSION 仅在本地缓存生效）。"
            exit 0
          fi
          TAG="${{ needs.check-version.outputs.release_tag }}"
          REF="${GITHUB_REF_NAME}"
          echo "  Target ref    : ${REF}"
          echo "  Release tag   : ${TAG}"
          echo "  Porcelain raw : [$(git status --porcelain LAST_VERSION 2>/dev/null | tr '\n' '|')]"

          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"

          if [ -z "$(git status --porcelain LAST_VERSION 2>/dev/null)" ]; then
            echo "LAST_VERSION 内容未变化（与 HEAD 一致），无需重复 commit/push。"
            exit 0
          fi

          git add LAST_VERSION
          git commit -m "chore(version): bump LAST_VERSION to ${TAG}"
          echo "  Committed: $(git rev-parse --short HEAD)"

          # 回推主仓库
          if git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${REF}"; then
            echo "已成功 push LAST_VERSION (${TAG}) 到 ${GITHUB_REPOSITORY}@${REF}"
          else
            echo "::warning:: push 失败，LAST_VERSION 未回写。请检查 token 权限(contents:write)或是否有远端冲突。"
            exit 0
          fi
